<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strumica closures · 1 November 2026</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>html,body,#map{margin:0;width:100%;height:100%;font:14px system-ui,sans-serif}#panel{position:absolute;top:12px;left:12px;z-index:2;background:#fffffff2;padding:13px;border-radius:10px;max-width:320px;box-shadow:0 2px 15px #0003}h2{margin:0 0 5px;font-size:18px}.muted{font-size:12px;color:#555}.swatch{display:inline-block;width:20px;border-top:5px solid #c72535;margin-right:7px}button{padding:6px;margin-top:6px}#status{font-size:12px;margin:9px 0}@media(max-width:550px){#panel{max-width:calc(100% - 42px);font-size:12px}}</style></head><body><div id="map"></div><div id="panel"><h2>Strumica · Sunday Run</h2><strong>1 November 2026 · 10:00–13:00</strong><p><span class="swatch"></span>Indicative road closures</p><label><input id="toggle" type="checkbox" checked> Show closures</label><div id="status">Loading OSM road geometry…</div><button id="retry">Retry download</button><p class="muted">Reconstructed from street names, not a verified police GIS file. Junction endpoints may be approximate. No live closure feed.</p><a target="_blank" href="https://strumicanet.com/%D1%83%D1%82%D1%80%D0%B5-%D0%BF%D0%BE%D1%81%D0%B5%D0%B1%D0%B5%D0%BD-%D1%80%D0%B5%D0%B6%D0%B8%D0%BC-%D0%BD%D0%B0-%D1%81%D0%BE%D0%BE%D0%B1%D1%80%D0%B0%D1%9C%D0%B0%D1%98-%D0%B2%D0%BE-%D1%81%D1%82%D1%80/">Source announcement</a></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',center:[22.643,41.4375],zoom:14.2,style:{version:8,sources:{base:{type:'raster',tiles:['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png','https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors © CARTO'}},layers:[{id:'base',type:'raster',source:'base',paint:{'raster-saturation':-1,'raster-opacity':0.75}}]}});map.addControl(new maplibregl.NavigationControl(),'bottom-right');
const status=document.getElementById('status');const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zа-яќѓѕџљњчшж0-9]/g,'');
const groups=[['Leninova',['ленинова','leninova']],['Marshal Tito',['маршал тито','маршал титo','marsal tito','marshal tito']],['Balkanska',['балканска','balkanska']],['Goce Delčev',['гоце делчев','goce delcev','goce delchev']]];
const q='[out:json][timeout:25];way(41.419,22.620,41.454,22.667)[highway][name];out geom;';
const servers=['https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.nchc.org.tw/api/interpreter'];
async function load(){status.textContent='Downloading road geometry…';let data=null,errors=[];for(let i=0;i<servers.length;i++){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),11000);try{status.textContent='Trying OSM server '+(i+1)+' of '+servers.length+'…';const url=servers[i]+'?data='+encodeURIComponent(q);const r=await fetch(url,{signal:ctrl.signal});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();if(!Array.isArray(data.elements))throw Error('Unexpected response');break}catch(e){errors.push(e.message)}finally{clearTimeout(timer)}}if(!data){status.textContent='OSM download failed: '+errors.join('; ')+'. Retry or try another network.';return}const fs=[];for(const w of data.elements){if(!w.geometry||!w.tags?.name)continue;let n=norm(w.tags.name);let g=groups.find(x=>x[1].some(a=>n.includes(norm(a))));if(!g)continue;fs.push({type:'Feature',properties:{name:g[0],osmName:w.tags.name,uncertain:true},geometry:{type:'LineString',coordinates:w.geometry.map(p=>[p.lon,p.lat])}})}const fc={type:'FeatureCollection',features:fs};if(map.getSource('closures'))map.getSource('closures').setData(fc);else{map.addSource('closures',{type:'geojson',data:fc});map.addLayer({id:'closure-halo',type:'line',source:'closures',paint:{'line-color':'#fff','line-width':10}});map.addLayer({id:'closures',type:'line',source:'closures',paint:{'line-color':'#c72535','line-width':6}});map.on('click','closures',e=>new maplibregl.Popup().setLngLat(e.lngLat).setText(e.features[0].properties.name+' — indicative extent only').addTo(map))}status.textContent=fs.length+' OSM segments loaded. Named-road extents are indicative, NOT exact closure sections.';document.getElementById('toggle').dispatchEvent(new Event('change'))}
map.on('load',load);document.getElementById('retry').onclick=load;document.getElementById('toggle').onchange=e=>{for(const id of ['closures','closure-halo'])if(map.getLayer(id))map.setLayoutProperty(id,'visibility',e.target.checked?'visible':'none')};
</script></body></html>

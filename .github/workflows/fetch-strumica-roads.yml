name: Fetch Strumica closure road geometry

on:
  push:
    paths:
      - '.github/workflows/fetch-strumica-roads.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download named roads from Overpass (with mirror fallback)
        run: |
          set -uo pipefail
          Q='[out:json][timeout:60];way(41.417,22.615,41.458,22.675)[highway][name~"ленин|тито|балкан|гоце|цветан|миладин|крушев|младин|јанков|lenin|tito|balkan|goce|cvetan|miladin|krusev|mladin|jankov",i];out geom;'
          ok=0
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "Trying $ep"
            if curl -sS --fail -m 120 -A "mhanmore-w-pages/1.0 (https://github.com/mhanmore/w)" -H "Accept: application/json" --data-urlencode "data=$Q" "$ep" -o /tmp/raw.json && python3 -c "import json;d=json.load(open('/tmp/raw.json'));assert len(d['elements'])>3"; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "All Overpass mirrors failed"; exit 1; }
      - name: Slim to lon/lat geometry and write report
        run: |
          python3 - <<'PY'
          import json, collections
          d = json.load(open('/tmp/raw.json'))
          ways = []
          for e in d['elements']:
              if e.get('type') != 'way' or 'geometry' not in e: continue
              t = e.get('tags', {})
              ways.append({'id': e['id'], 'name': t.get('name'), 'name_en': t.get('name:en'),
                           'highway': t.get('highway'),
                           'g': [[round(p['lon'], 6), round(p['lat'], 6)] for p in e['geometry']]})
          out = {'source': 'OpenStreetMap via Overpass API', 'osm_timestamp': d.get('osm3s', {}).get('timestamp_osm_base'), 'ways': ways}
          json.dump(out, open('strumica-closures/roads.json', 'w'), ensure_ascii=False, separators=(',', ':'))
          names = collections.Counter(w['name'] for w in ways)
          with open('strumica-closures/road-names.txt', 'w') as f:
              for n, c in sorted(names.items()): f.write(f'{c}\t{n}\n')
          print(len(ways), 'ways;', len(names), 'names')
          PY
      - name: Commit data and redeploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strumica-closures/roads.json strumica-closures/road-names.txt
          git commit -m "Add Strumica OSM road geometry" || echo "No changes"
          git push
          gh workflow run pages.yml --ref main

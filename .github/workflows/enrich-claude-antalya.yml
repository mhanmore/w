name: Enrich Claude Antalya brochure

on:
  push:
    paths:
      - '.github/workflows/enrich-claude-antalya.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Göynük image
        run: |
          set -euxo pipefail
          mkdir -p claude/images
          curl -L --fail --retry 3 'https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/G%C3%B6yn%C3%BCk%20Kanyon%20-%20panoramio%20%2828%29.jpg&width=1280' -o claude/images/goynuk.jpg
      - name: Enrich brochure
        run: python3 scripts/enrich_claude_antalya.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add claude
          git diff --cached --quiet || git commit -m 'Enrich Claude Antalya brochure'
          git push
